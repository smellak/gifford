# https://taskfile.dev
version: "3"

vars:
  MODULE: github.com/smellak/gifford
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "devel"
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  LDFLAGS: -s -w -X {{.MODULE}}/internal/version.Version={{.VERSION}} -X {{.MODULE}}/internal/version.Commit={{.COMMIT}}

env:
  CGO_ENABLED: "0"

tasks:
  default:
    cmds: [task --list]

  build:
    desc: Build the gifford and privileged tmux helper binaries into bin/
    sources: ["**/*.go", "go.mod", "profiles/**", "schemas/**", "migrations/**", "internal/analyst/prompts/**", "internal/channel/budgets/**", "internal/channel/queries/**"]
    generates: ["bin/gifford", "bin/gifford-tmux"]
    cmds:
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o bin/gifford ./cmd/gifford
      - go build -trimpath -o bin/gifford-tmux ./cmd/gifford-tmux

  build:cross:
    desc: Cross-build every package for the non-Linux CI targets
    cmds:
      - GOOS=darwin GOARCH=amd64 go build ./...
      - GOOS=windows GOARCH=amd64 go build ./...

  run:
    desc: Build and run (task run -- <args>)
    deps: [build]
    cmds: ["./bin/gifford {{.CLI_ARGS}}"]

  dev:
    desc: Run from source with the dev profile
    cmds: ["go run ./cmd/gifford up --dev"]

  test:
    desc: Unit tests (fast, local)
    cmds: ["go test -failfast ./..."]

  test:race:
    desc: Unit tests with the race detector (what CI runs)
    env: { CGO_ENABLED: "1" }
    cmds: ["go test -race -failfast ./..."]

  test:update:
    desc: Regenerate .golden files
    cmds: ["go test ./... -update"]

  test:install:
    desc: Short checks of the release bootstrap and installation diagnostics (no deployment)
    cmds:
      - sh -n scripts/install.sh
      - sh scripts/check_install_system_unit.sh
      - sh scripts/install.sh --version v0.1.0 --bin-dir /tmp/gifford-install-preview --dry-run
      - sh scripts/install.sh --version v0.1.0 --system-node --node-id node-test --dry-run
      - go test -failfast ./internal/cli/doctor

  verify:incidents:
    desc: Focused read-only incident projection checks, with no live agents or deployment
    cmds:
      - go test -failfast ./internal/protocol ./internal/controlapi ./internal/config ./internal/cli/hub
      - go vet ./internal/protocol ./internal/controlapi ./internal/config ./internal/cli/hub
      - task: build

  verify:incidents:race:
    desc: Race check for incident reads (latency capacity is checked without instrumentation)
    env: { CGO_ENABLED: "1" }
    cmds: ["go test -race -failfast ./internal/controlapi -run '^TestIncident(Projects|Pagination|Resolution|ReadsOnly|QueryPlan|Concurrent)' -count=1"]

  verify:incidents:lint:
    desc: Lint the incident projection and its integration without running the full CI
    cmds:
      - golangci-lint run --config .golangci.yml --timeout 2m ./internal/protocol ./internal/controlapi ./internal/config ./internal/cli/hub
      - task: lint:guards

  verify:pane-lock:
    desc: Focused cooperative pane-lock checks without the full unit suite
    cmds:
      - go test -failfast ./internal/tmuxlock ./internal/tmuxlock/writerlog ./internal/proxy/tmuxattach ./internal/orchestrator ./internal/tmuxinstance ./internal/controlapi ./internal/config ./internal/cli/hub
      - go vet ./internal/tmuxlock ./internal/tmuxlock/writerlog ./internal/proxy/tmuxattach ./internal/orchestrator ./internal/tmuxinstance ./internal/controlapi ./internal/config ./internal/cli/hub
      - task: build

  verify:pane-lock:race:
    desc: Focused race checks for the flock writer and concurrent transport adapter
    env: { CGO_ENABLED: "1" }
    cmds:
      - go test -race -failfast ./internal/tmuxlock ./internal/tmuxlock/writerlog ./internal/proxy/tmuxattach

  verify:pane-lock:lint:
    desc: Lint the cooperative pane-lock packages and integration only
    cmds:
      - golangci-lint run --config .golangci.yml --timeout 3m ./internal/tmuxlock ./internal/tmuxlock/writerlog ./internal/proxy/tmuxattach ./internal/orchestrator ./internal/tmuxinstance ./internal/controlapi ./internal/config ./internal/cli/hub
      - task: lint:guards

  test:mcp:
    desc: Focused checks of MCP setup and local socket selection (no deployment)
    cmds: ["go test -count=1 -failfast ./internal/cli/mcp"]

  verify:mcp:
    desc: MCP checks, native and cross-platform builds, vet, formatting and project lint
    cmds:
      - task: test:mcp
      - task: build
      - GOOS=darwin GOARCH=amd64 go build ./...
      - GOOS=windows GOARCH=amd64 go build ./...
      - go vet ./...
      - test -z "$(gofumpt -l .)"
      - task: lint

  ml:serve:test:
    desc: Unit tests of the Glimmer endpoint in ml/serve (Python stdlib; no GPU or Modal)
    dir: ml/serve
    cmds: ["python3 -m unittest discover -s tests -t ."]

  adapters:opencode:test:
    desc: Unit tests of the OpenCode 1.18.29 native-events plugin
    cmds: ["node --test adapters/opencode/test/*.test.js"]

  adapters:claude-code-mod:test:
    desc: Validate and test the Claude Code 2.1.316 native observer mod
    cmds:
      - npm --prefix adapters/claude-code/mod exec -- claude plugin validate --strict adapters/claude-code/mod
      - npm --prefix adapters/claude-code/mod exec -- claude plugin test adapters/claude-code/mod

  test:record:
    desc: Re-record Glimmer cassettes (needs a live endpoint; never in CI)
    cmds: ["GIFFORD_RECORD=1 go test ./internal/gateway/... -run Cassette -count=1"]

  test:live:
    desc: Call a deployed Glimmer endpoint through the gateway with the three contracts (needs a live endpoint; never in CI)
    cmds: ["GIFFORD_LIVE=1 go test ./internal/analyst/ -run '^TestLiveGlimmer$' -count=1 -v"]

  fuzz:
    desc: Keyboard-vs-injection race fuzzer (task fuzz -- --scenarios 100000 --baseline)
    cmds: ["go run ./cmd/gifford fuzz {{.CLI_ARGS}}"]

  conformance:
    desc: "Conformance suite against the installed harnesses (tag: conformance)"
    cmds: ["go test -tags conformance ./test/conformance/..."]

  lint:
    desc: golangci-lint + project guards
    cmds:
      - task: lint:guards
      - task: lint:log
      - golangci-lint run --config .golangci.yml --timeout 5m

  lint:fix:
    cmds: ["golangci-lint run --config .golangci.yml --timeout 5m --fix"]

  lint:guards:
    desc: Project invariants no linter covers (tmux transport, observe-only capture, single writer, channel gate)
    cmds: ["./scripts/check_guards.sh"]

  lint:log:
    desc: Log messages start with a capital letter
    cmds: ["./scripts/check_log_capitalization.sh"]

  fmt:
    cmds: ["gofumpt -w .", "goimports -local {{.MODULE}} -w ."]

  modernize:
    cmds: ["go run golang.org/x/tools/go/analysis/passes/modernize/cmd/modernize@latest -fix -test ./..."]

  tidy:
    cmds: ["go mod tidy", "git diff --exit-code go.mod go.sum"]

  generate:
    desc: Regenerate schemas and docs/CLI.md from Go types and cobra
    cmds: ["go generate ./..."]

  generate:check:
    cmds:
      - task: generate
      - git diff --exit-code

  release:snapshot:
    cmds: ["goreleaser release --snapshot --clean"]
