# Example configuration for a deployment that serves the base model only,
# before any adapter is trained: no [adapter] table, so vLLM runs without
# LoRA, the adapters volume is not mounted and analyst-lora requests get a
# 400. Copy it outside the repository, fill the placeholders and point
# GLIMMER_SERVE_CONFIG at the copy. It never holds a token.

[model]
repo = "example-org/muse-glimmer"     # the Hugging Face repo of the base weights
revision = "REVISION"                  # a pinned commit, never a branch
served_name = "glimmer-base"
quantization = ""                      # e.g. "fp8"; empty serves the weights as published
max_model_len = 8192

[serve]
gpu = "GPU"                            # chosen by measurement; see README
secret_name = "glimmer-endpoint"       # Modal secret holding GLIMMER_TOKEN
# hf_secret_name = "huggingface"       # optional Modal secret holding HF_TOKEN, if the model needs one
vllm_version = "VLLM_VERSION"          # pinned; check the vllm_args flags against it
startup_timeout_s = 900                # 60..1800: the container start and the vLLM readiness wait
chat_template_kwargs = { enable_thinking = false }
