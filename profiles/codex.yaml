# Measured with gifford keycap; input_line and input_placeholder stay hand-tuned.
harness: codex
measured: true
version_range: "0.154.0"
auxiliary_executable: codex-code-mode-host
submit: "\r"
insert_newline: "\n"
clear_line: "\u0015"
cancel: "\u0003"
bracketed_paste: true
extended_keyboard: none
input_line: '^› (.*)$'
input_placeholder: "Ask Codex to do anything"
input_bounds:
  above:
    - "^$"
    - "^$"
    - not: "^$"
  below:
    - "^$"
    - '^  \S.* · .* · .+$'
