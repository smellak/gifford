# Measured with gifford keycap; input_line and input_placeholder stay hand-tuned.
harness: codex
measured: true
# Blind-checked on this harness's question screens with unsafe_phase_limit 0.25,
# the node-wide value: blind runs 3 (24/24) and 4 (23/24, no intervention)
# across Claude Code, Codex, OpenCode and Muse Code.
corroboration: true
version_range: "0.154.0"
auxiliary_executable: codex-code-mode-host
submit: "\r"
insert_newline: "\n"
clear_line: "\u0015"
cancel: "\u0003"
bracketed_paste: true
extended_keyboard: none
input_line: '^› (.*)$'
input_placeholder: "Ask Codex to do anything"
input_bounds:
  above:
    - "^$"
    - "^$"
    - not: "^$"
  below:
    - "^$"
    - '^  \S.*( · .*)?$'
