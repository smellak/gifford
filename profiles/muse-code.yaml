# Measured with gifford keycap on 1.4.13-R6996.1; 1.4.14-R7309.1 was re-measured
# through tmux with the same submit, newline, clear, cancel and paste bytes and
# the same composer. input_line and input_placeholder stay hand-tuned.
harness: muse-code
measured: true
# Blind-checked on this harness's question screens with unsafe_phase_limit 0.25,
# the node-wide value: blind runs 3 (24/24) and 4 (23/24, no intervention)
# across Claude Code, Codex, OpenCode and Muse Code.
corroboration: true
version_range: "1.4.13-R6996.1 | 1.4.14-R7309.1"
submit: "\r"
insert_newline: "\x1b\r"
clear_line: "\x15"
cancel: "\x03"
bracketed_paste: true
extended_keyboard: none
input_line: "^❯ ?(.*)$"
# Muse rotates a hint on its empty prompt row, drawn in indexed foreground
# 242 on the default background with the cursor on its first column; a draft
# is drawn in the normal colour. Measured on 1.4.14-R7309.1 through the vt.
input_placeholder:
  any_text: true
  style:
    foreground_index: 242
    background: default
input_bounds:
  above: ['^─+$']
  below: ['^─+$']
