# Measured with gifford keycap; input_line and input_placeholder stay hand-tuned.
harness: muse-code
measured: true
version_range: "1.4.13-R6996.1"
submit: "\r"
insert_newline: "\x1b\r"
clear_line: "\x15"
cancel: "\x03"
bracketed_paste: true
extended_keyboard: none
input_line: "^❯ ?(.*)$"
input_bounds:
  above: ['^─+$']
  below: ['^─+$']
