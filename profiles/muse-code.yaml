# Measured with gifford keycap; input_line, input_placeholder and input_bounds stay hand-tuned.
harness: muse-code
measured: true
version_range: "1.4.13-R6996.1"
submit: "\r"
insert_newline: "\u001b\r"
clear_line: "\u0015"
cancel: "\u0003"
bracketed_paste: false
extended_keyboard: none
input_line: "^❯ ?(.*)$"
input_bounds:
  above:
    - "^─+$"
  below:
    - "^─+$"
