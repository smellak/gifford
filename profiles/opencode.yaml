# Measured with gifford keycap; input_line and input_placeholder stay hand-tuned.
harness: opencode
measured: true
version_range: "1.18.29"
submit: "\r"
insert_newline: "\n"
clear_line: "\x15"
cancel: "\x03"
bracketed_paste: true
extended_keyboard: none
input_line: '^ *┃(?:  (.*))?$'
input_placeholder:
  prefix: "Ask anything"
  style:
    foreground_index: 8
    background_index: 234
input_bounds:
  above:
    - '^ *┃$'
    - not: '^ *┃.*$'
  below: ['^ *┃$', '^ *┃  \S.*$', '^ *╹▀+$']
  box:
    left_column: 2
    layouts:
      - {columns: 80, right_margin: 2, bottom_margin: 3}
      - {columns: 100, right_margin: 2, bottom_margin: 2}
      - {columns: 120, right_margin: 2, bottom_margin: 2}
      - {columns: 140, right_margin: 44, bottom_margin: 2}
      - {columns: 160, right_margin: 44, bottom_margin: 2}
      - {columns: 180, right_margin: 44, bottom_margin: 2}
      - {columns: 200, right_margin: 44, bottom_margin: 2}
      - {columns: 220, right_margin: 44, bottom_margin: 2}
