# Measured with gifford keycap; input_line and input_placeholder stay hand-tuned.
harness: opencode
measured: true
version_range: "1.18.29"
submit: "\r"
insert_newline: "\n"
clear_line: "\x15"
cancel: "\x03"
bracketed_paste: true
extended_keyboard: none
input_line: '^ *┃(?:  (.*))?$'
input_bounds:
  above:
    - '^ *┃$'
    - not: '^ *┃.*$'
  below: ['^ *┃$', '^ *┃  \S.*$', '^ *╹▀+$']
