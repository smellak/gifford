# Measured with gifford keycap; input_line and input_placeholder stay hand-tuned.
harness: claude-code
measured: true
version_range: "2.1.280"
submit: "\r"
insert_newline: "\n"
clear_line: "\u0015"
cancel: "\u0003"
bracketed_paste: true
extended_keyboard: none
input_line: "^❯\u00a0(.*)$"
input_bounds:
  above: ["^─+$"]
  below: ["^─+$"]
