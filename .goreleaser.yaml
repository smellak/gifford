version: 2
project_name: gifford
before:
  hooks:
    - go mod tidy
    - sh -c 'mkdir -p completions manpages'
    - sh -c 'go run ./cmd/gifford completion bash > completions/gifford.bash'
    - sh -c 'go run ./cmd/gifford completion zsh  > completions/gifford.zsh'
    - sh -c 'go run ./cmd/gifford completion fish > completions/gifford.fish'
    - sh -c 'go run ./cmd/gifford man | gzip -c > manpages/gifford.1.gz'
builds:
  - id: gifford
    main: ./cmd/gifford
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/smellak/gifford/internal/version.Version={{.Version}}
      - -X github.com/smellak/gifford/internal/version.Commit={{.Commit}}
      - -X github.com/smellak/gifford/internal/version.Date={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"
archives:
  - formats: [tar.gz]
    files: [LICENSE, README.md, completions/*, manpages/*]
checksum:
  name_template: checksums.txt
snapshot:
  version_template: "0.0.0-{{ .Timestamp }}"
changelog:
  sort: asc
  use: github
  groups:
    - { title: Features, regexp: '^.*?feat(\(.+\))??!?:.+$', order: 0 }
    - { title: Bug fixes, regexp: '^.*?fix(\(.+\))??!?:.+$', order: 1 }
    - { title: Other, order: 999 }
  filters:
    exclude: ["^docs", "^test", "^chore\\(deps\\)", "^ci"]
release:
  prerelease: auto
