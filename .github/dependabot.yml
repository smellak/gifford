version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups: { all: { patterns: ["*"] } }
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { all: { patterns: ["*"] } }
    commit-message: { prefix: "ci(deps)" }
